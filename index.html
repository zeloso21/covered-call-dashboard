<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커버드콜 ETF 월배당 정보</title>
<link rel="stylesheet" href="site.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
.wrap{max-width:1180px;margin:0 auto;padding:var(--gap);}
.hdr{background:var(--header);color:#fff;border-radius:var(--r);padding:20px 24px;margin-bottom:var(--gap);}
.hdr h1{font-size:18px;font-weight:600;}
.hdr .sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:6px;line-height:1.6;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:var(--gap);}
.hint{font-size:12px;color:var(--muted);margin:0 0 14px;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
th{color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card);z-index:1;}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:130px;position:sticky;left:0;background:var(--card);box-shadow:2px 0 4px -2px rgba(0,0,0,.12);}
th:first-child{z-index:2;}
th.active{color:var(--blue);}
th.active::after{content:'';display:inline-block;width:0;height:0;margin-left:4px;border:4px solid transparent;vertical-align:middle;}
th.active.desc::after{border-top-color:var(--blue);}
th.active.asc::after{border-bottom-color:var(--blue);}
.yield{font-weight:700;color:var(--blue);}
.sum-cell{font-weight:600;}
.mo-zero{color:var(--muted);}
.month-td{min-width:70px;}
th.grp,td.grp-start{border-left:1px solid var(--border);}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:26px;vertical-align:middle;}
.spark i{display:inline-block;width:6px;background:var(--blue);border-radius:2px 2px 0 0;min-height:2px;}
.spark i.zero{background:var(--border);}
.filters{display:flex;flex-direction:column;gap:10px;}
.filters .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
.filters .row > .k{font-size:12px;color:var(--muted);font-weight:600;min-width:62px;}
.filters input[type=search]{flex:1 1 220px;font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);}
.chip{font:inherit;font-size:12.5px;padding:4px 11px;border-radius:16px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;}
.chip[aria-pressed="true"]{background:var(--header);border-color:var(--header);color:#fff;}
.chip .n{color:var(--muted);font-size:11px;margin-left:3px;}
.chip[aria-pressed="true"] .n{color:rgba(255,255,255,.7);}
.filters .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;}
.filters .meta button{font:inherit;font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;}
td:first-child a{color:var(--text);text-decoration:none;font-weight:600;}
td:first-child a:hover{color:var(--accent);text-decoration:underline;}
td:first-child .badge{margin:2px 4px 0 0;font-size:10.5px;}
.empty{text-align:center !important;color:var(--muted);padding:24px !important;position:static !important;box-shadow:none !important;}
.foot{font-size:11px;color:var(--muted);line-height:1.7;padding:4px 2px 20px;}
@media(max-width:640px){
  .wrap{padding:10px;} .hdr{padding:14px 16px;} .card{padding:12px 10px;}
  .hdr h1{font-size:16px;} .hdr .sub{font-size:11px;}
  th,td{padding:7px 6px;font-size:12px;}
  th:first-child,td:first-child{min-width:100px;font-size:12px;}
  .month-td{min-width:44px;}
  .spark{height:20px;} .spark i{width:4px;}
  .hint{font-size:11px;}
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="site-nav" aria-label="페이지"><a class="brand" href="./">커버드콜 ETF</a><div class="tabs"><a href="./" aria-current="page">배당 정보표</a><a href="overview.html">한눈에 보기</a><a href="simulator.html">시뮬레이터</a></div></nav>
  <div class="hdr">
    <h1>커버드콜 ETF 월배당 정보</h1>
    <div class="sub" id="hdrSub">불러오는 중…</div>
  </div>

  <div class="card filters" id="filters">
    <div class="row"><input type="search" id="q" placeholder="종목명·코드 검색 (예: 나스닥, 200, 441680)" autocomplete="off" aria-label="종목명·코드 검색"></div>
    <div class="row" id="amcChips"><span class="k">운용사</span></div>
    <div class="row" id="grpChips"><span class="k">기초자산</span></div>
    <div class="meta"><span id="count"></span><span>기초자산은 <b>종목명 기준</b> 자동 분류(실제 보유 종목과 다를 수 있음)</span><button type="button" id="reset">필터 해제</button></div>
  </div>

  <div class="card">
    <div class="hint">표 머리글을 클릭하면 정렬 기준이 바뀝니다. 월별 배당액은 종목별 최종배당월 기준 최근 6개월(0원 달 포함), 맨 끝 추세는 같은 6개월을 오래된 순서로 본 미니 막대차트입니다.</div>
    <div class="tbl-wrap">
      <table id="tbl">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="foot" id="foot"></div>
  <div class="disclaimer">과거 실적 기반이며 미래 수익을 보장하지 않습니다. 투자 권유가 아닙니다.</div>
</div>
<script src="cc-core.js"></script>

<script>
let DATA = [];
let MONTH_COLS = []; // [{key:'m0', ym:'2026-08', label:'8월'}, ...] newest→oldest
let sortKey = 'yield', sortDir = 'desc';
// 필터 상태 (URL 쿼리 q / amc / grp / sort / dir 와 동기화)
const F = {q:'', amc:new Set(), grp:new Set()};
let LISTED = {};   // code -> 첫 데이터 월(history.json). 상장 전 0원 달을 '미지급'으로 오인하지 않기 위함
const SORT_KEYS = ['name','price','sum','yield','month'];

// 배지: '미지급 월 있음' = 상장 다음 달 이후 6개월 중 0원 달 존재
//       '배당 감소 추세' = 6개월이 모두 상장 후일 때, 최근 3개월 평균이 이전 3개월 평균보다 15% 이상 적음
function flagsOf(r){
  const first = LISTED[r.code];
  const asc = [...r.monthly_divs].sort((a, b) => a.month.localeCompare(b.month));
  const live = asc.filter(d => !first || d.month > first);
  const unpaid = live.filter(d => d.amount === 0).map(d => d.month);
  let decline = null;
  if (asc.length === 6 && live.length === 6) {
    const prev = (asc[0].amount + asc[1].amount + asc[2].amount) / 3;
    const last = (asc[3].amount + asc[4].amount + asc[5].amount) / 3;
    if (prev > 0 && last < prev * 0.85) decline = (last / prev - 1) * 100;
  }
  return {unpaid, decline};
}
function matches(r){
  if (F.amc.size && !F.amc.has(r.amc)) return false;
  if (F.grp.size && !F.grp.has(r.group)) return false;
  if (F.q) {
    const q = F.q.toLowerCase().replace(/\s+/g, '');
    if (!r.name.toLowerCase().replace(/\s+/g, '').includes(q) && !r.code.toLowerCase().includes(q)) return false;
  }
  return true;
}
function syncURL(){
  const p = new URLSearchParams();
  if (F.q) p.set('q', F.q);
  if (F.amc.size) p.set('amc', [...F.amc].join(','));
  if (F.grp.size) p.set('grp', [...F.grp].join(','));
  if (sortKey !== 'yield' || sortDir !== 'desc') { p.set('sort', sortKey); p.set('dir', sortDir); }
  const qs = p.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
}
function readURL(){
  const p = new URLSearchParams(location.search);
  F.q = p.get('q') || '';
  F.amc = new Set((p.get('amc') || '').split(',').filter(Boolean));
  F.grp = new Set((p.get('grp') || '').split(',').filter(Boolean));
  if (SORT_KEYS.includes(p.get('sort'))) sortKey = p.get('sort');
  if (['asc','desc'].includes(p.get('dir'))) sortDir = p.get('dir');
}
function buildChips(){
  const count = key => DATA.reduce((m, r) => (m[r[key]] = (m[r[key]] || 0) + 1, m), {});
  const amcN = count('amc'), grpN = count('group');
  const amcs = Object.keys(amcN).sort();
  const grps = CC.GROUPS.filter(g => grpN[g]);
  const chip = (kind, v, n) => `<button type="button" class="chip" data-kind="${kind}" data-v="${v}" aria-pressed="${F[kind].has(v)}">${v}<span class="n">${n}</span></button>`;
  document.getElementById('amcChips').insertAdjacentHTML('beforeend', amcs.map(v => chip('amc', v, amcN[v])).join(''));
  document.getElementById('grpChips').insertAdjacentHTML('beforeend', grps.map(v => chip('grp', v, grpN[v])).join(''));
  document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    const set = F[b.dataset.kind], v = b.dataset.v;
    set.has(v) ? set.delete(v) : set.add(v);
    b.setAttribute('aria-pressed', set.has(v));
    render();
  }));
  const q = document.getElementById('q');
  q.value = F.q;
  q.addEventListener('input', () => { F.q = q.value.trim(); render(); });
  document.getElementById('reset').addEventListener('click', () => {
    F.q = ''; F.amc.clear(); F.grp.clear(); q.value = '';
    document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', 'false'));
    render();
  });
}

function fmtNum(n){ return Math.round(n).toLocaleString('ko-KR'); }
function fmtWon(n){ return fmtNum(n) + '원'; }

function shiftYm(ym, delta){
  const [y, m] = ym.split('-').map(Number);
  const idx = y * 12 + (m - 1) + delta;
  return `${Math.floor(idx / 12)}-${String(idx % 12 + 1).padStart(2, '0')}`;
}

function modeLastDivMonth(rows){
  const count = {};
  rows.forEach(r => { count[r.last_div_month] = (count[r.last_div_month] || 0) + 1; });
  return Object.entries(count).sort((a, b) => b[1] - a[1])[0][0];
}

function buildMonthCols(anchorYm){
  // newest(anchor) → oldest, 6칸. 같은 해면 "8월"처럼 단순 표기, 연도가 바뀌는
  // 지점에서만 "25.8월"처럼 연도를 붙인다(맨 앞 칸은 상단 기준일로 이미 연도가 드러나 생략).
  const yms = Array.from({length: 6}, (_, i) => shiftYm(anchorYm, -i));
  return yms.map((ym, i) => {
    const [y, m] = ym.split('-');
    const prevY = i === 0 ? null : yms[i - 1].split('-')[0];
    const label = (i > 0 && y !== prevY) ? `${y.slice(2)}.${Number(m)}월` : `${Number(m)}월`;
    return {key: `m${i}`, ym, label};
  });
}

function sparkline(monthlyDivs){
  // 오래된→최신 순으로 그려서 "추세"로 읽히게 한다.
  const asc = [...monthlyDivs].sort((a, b) => a.month.localeCompare(b.month));
  const max = Math.max(1, ...asc.map(d => d.amount));
  const bars = asc.map(d => {
    const h = Math.max(2, Math.round(d.amount / max * 24));
    const cls = d.amount > 0 ? '' : ' zero';
    const title = `${d.month}: ${fmtWon(d.amount)}`;
    return `<i class="${cls.trim()}" style="height:${h}px" title="${title}"></i>`;
  }).join('');
  return `<span class="spark">${bars}</span>`;
}

function render(){
  const cols = [
    {key:'name',  label:'종목명',           sortable:true,  dir:'asc'},
    {key:'price', label:'최종배당시 주가',   sortable:true,  dir:'desc'},
    {key:'sum',   label:'6개월 합계',        sortable:true,  dir:'desc'},
    {key:'yield', label:'연배당율',          sortable:true,  dir:'desc'},
    {key:'month', label:'최종배당월',        sortable:true,  dir:'desc'},
    ...MONTH_COLS.map(mc => ({key:mc.key, label:mc.label, sortable:false})),
    {key:'trend', label:'추세',              sortable:false},
  ];

  const thead = document.getElementById('thead');
  thead.innerHTML = '<tr>' + cols.map(c => {
    const active = c.key === sortKey;
    const cls = [active ? `active ${sortDir}` : '', c.key === 'month' ? 'grp' : ''].filter(Boolean).join(' ');
    return `<th data-key="${c.key}" class="${cls}">${c.label}</th>`;
  }).join('') + '</tr>';
  thead.querySelectorAll('th').forEach(th => {
    const col = cols.find(c => c.key === th.dataset.key);
    if (!col.sortable) return;
    th.addEventListener('click', () => {
      if (sortKey === col.key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortKey = col.key; sortDir = col.dir; }
      render();
    });
  });

  const withCalc = DATA.map(r => ({
    ...r,
    sum6: r.monthly_divs.reduce((s, d) => s + d.amount, 0),
    byMonth: Object.fromEntries(r.monthly_divs.map(d => [d.month, d.amount])),
  }));

  const rows = withCalc.filter(matches).sort((a, b) => {
    let av, bv;
    if (sortKey === 'name') { av = a.name; bv = b.name; }
    else if (sortKey === 'price') { av = a.price_at_last_div; bv = b.price_at_last_div; }
    else if (sortKey === 'month') { av = a.last_div_month; bv = b.last_div_month; }
    else if (sortKey === 'sum') { av = a.sum6; bv = b.sum6; }
    else { av = a.ann_yield_pct; bv = b.ann_yield_pct; }
    if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortDir === 'asc' ? av - bv : bv - av;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = rows.map(r => {
    const monthCells = MONTH_COLS.map(mc => {
      const amt = r.byMonth[mc.ym];
      if (amt === undefined) return `<td class="month-td mo-zero">–</td>`;
      if (amt === 0) return `<td class="month-td mo-zero" title="${mc.ym}: 0원">–</td>`;
      return `<td class="month-td" title="${mc.ym}">${fmtNum(amt)}</td>`;
    }).join('');
    return `
    <tr>
      <td><a href="simulator.html?code=${encodeURIComponent(r.code)}" title="시뮬레이터에서 짝꿍 ETF와 비교">${r.name}</a>${badgesOf(r)}</td>
      <td>${fmtWon(r.price_at_last_div)}</td>
      <td class="sum-cell">${fmtWon(r.sum6)}</td>
      <td class="yield">${r.ann_yield_pct.toFixed(2)}%</td>
      <td class="grp-start">${r.last_div_month}</td>
      ${monthCells}
      <td class="grp-start">${sparkline(r.monthly_divs)}</td>
    </tr>`;
  }).join('') || `<tr><td class="empty" colspan="${cols.length}">조건에 맞는 종목이 없습니다.</td></tr>`;
  document.getElementById('count').textContent = `${rows.length} / ${DATA.length}종 표시`;
  syncURL();
}
function badgesOf(r){
  const f = flagsOf(r);
  let b = '';
  if (f.unpaid.length) b += ` <span class="badge" title="0원 달: ${f.unpaid.join(', ')} (상장 첫 달까지는 제외)">미지급 월 있음</span>`;
  if (f.decline !== null) b += ` <span class="badge" title="최근 3개월 평균이 이전 3개월보다 ${Math.abs(f.decline).toFixed(0)}% 적음">배당 감소 추세</span>`;
  return b ? '<br>' + b.trim() : '';
}

Promise.all([
  fetch('data.json').then(r => r.json()),
  fetch('history.json').then(r => r.json()).catch(() => null),   // 없어도 표는 동작(배지 판정만 단순화)
]).then(([d, h]) => {
  if (h) for (const [code, x] of Object.entries(h.series)) LISTED[code] = x.m[0];
  return d;
}).then(d => {
  DATA = (d.etfs || []).map(r => ({...r, amc: CC.amcOf(r.name), group: CC.groupOf(r.name)}));
  readURL();
  buildChips();
  if (DATA.length) MONTH_COLS = buildMonthCols(modeLastDivMonth(DATA));
  document.getElementById('hdrSub').textContent =
    `${d.generated} 기준 · 월배당 커버드콜 ETF ${DATA.length}종 · ${d.assumptions}`;
  document.getElementById('foot').innerHTML =
    '이 페이지는 정보 제공 목적이며 투자 권유가 아닙니다. 월별 배당액 헤더는 대부분 종목이 공유하는 최근 6개월 기준이며, 배당 시기가 다른 소수 종목은 셀에 마우스를 올리면 실제 해당 월이 표시됩니다. 연배당율은 각 종목 자신의 최종배당월 6개월 실적을 단순 연율화한 값으로, 향후 분배금이 달라지면 실제 수익률과 차이가 날 수 있습니다.';
  render();
}).catch(err => {
  document.getElementById('hdrSub').textContent = '데이터를 불러오지 못했습니다.';
  console.error(err);
});
</script>
</body>
</html>
